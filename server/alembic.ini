[alembic]
script_location = %(here)s/migraciones
version_locations = %(here)s/migraciones/versiones
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = consola

[formatters]
keys = simple

[logger_root]
level = WARNING
handlers = consola

[handler_consola]
class = StreamHandler
args = (sys.stderr,)
formatter = simple

[formatter_simple]
format = %(levelname)s %(name)s %(message)s
